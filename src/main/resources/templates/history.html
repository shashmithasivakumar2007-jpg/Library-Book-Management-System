<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><title>Borrowing History</title></head><body class="container py-4"><h3>Student Borrowing History</h3><table class="table"><tr><th>Book</th><th>Issue date</th><th>Due date</th><th>Return date</th></tr><tr th:each="l:${history}"><td th:text="${l.book.title}"></td><td th:text="${l.issueDate}"></td><td th:text="${l.dueDate}"></td><td th:text="${l.returnDate==null?'Not returned':l.returnDate}"></td></tr></table><a href="/" class="btn btn-primary">Back</a></body></html>
