<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Library Management</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f3f5fa}.hero{background:#172554;color:white;padding:25px;border-radius:16px}.card{border:0;box-shadow:0 3px 15px #0001}</style></head><body><main class="container py-4"><header class="hero mb-4"><h2>Library Book Management</h2><p class="mb-0">Books • Membership • Issue and Return • Reading Reports</p></header><div th:if="${msg}" class="alert alert-info" th:text="${msg}"></div>
<div class="row g-3 mb-3"><div class="col"><div class="card p-3">Book records<h3 th:text="${#lists.size(books)}"></h3></div></div><div class="col"><div class="card p-3">Members<h3 th:text="${#lists.size(students)}"></h3></div></div><div class="col"><div class="card p-3">Issued<h3 th:text="${#lists.size(active)}"></h3></div></div><div class="col"><div class="card p-3">Overdue<h3 th:text="${#lists.size(overdue)}"></h3></div></div></div>
<div class="row g-3"><div class="col-md-6"><div class="card p-3"><h5>Add book</h5><form th:action="@{/books}" th:object="${book}" method="post"><input class="form-control mb-2" th:field="*{title}" placeholder="Title" required><input class="form-control mb-2" th:field="*{author}" placeholder="Author" required><input class="form-control mb-2" th:field="*{category}" placeholder="Category" required><input class="form-control mb-2" type="number" min="0" th:field="*{totalQuantity}" placeholder="Quantity" required><button class="btn btn-primary">Save book</button></form></div></div>
<div class="col-md-6"><div class="card p-3"><h5>Register student</h5><form th:action="@{/students}" th:object="${student}" method="post"><input class="form-control mb-2" th:field="*{name}" placeholder="Name" required><input class="form-control mb-2" th:field="*{rollNumber}" placeholder="Roll number" required><input class="form-control mb-2" type="email" th:field="*{email}" placeholder="Email" required><button class="btn btn-success">Register</button></form></div></div></div>
<div class="card p-3 mt-3"><h5>Issue book</h5><form th:action="@{/issue}" method="post" class="row g-2"><div class="col-md-5"><select name="bookId" class="form-select" required><option value="">Choose available book</option><option th:each="b:${books}" th:if="${b.availableQuantity>0}" th:value="${b.id}" th:text="${b.title+' ('+b.availableQuantity+')'}"></option></select></div><div class="col-md-5"><select name="studentId" class="form-select" required><option value="">Choose student</option><option th:each="s:${students}" th:value="${s.id}" th:text="${s.name+' / '+s.rollNumber}"></option></select></div><div class="col-md-2"><button class="btn btn-primary w-100">Issue</button></div></form></div>
<div class="card p-3 mt-3"><h5>Inventory</h5><div class="table-responsive"><table class="table"><thead><tr><th>Title</th><th>Author</th><th>Category</th><th>Total</th><th>Available</th></tr></thead><tbody><tr th:each="b:${books}"><td th:text="${b.title}"></td><td th:text="${b.author}"></td><td th:text="${b.category}"></td><td th:text="${b.totalQuantity}"></td><td th:text="${b.availableQuantity}"></td></tr></tbody></table></div></div>
<div class="card p-3 mt-3"><h5>Loan report</h5><div class="table-responsive"><table class="table"><thead><tr><th>Student</th><th>Book</th><th>Issue</th><th>Due</th><th>Return</th><th>Action</th></tr></thead><tbody><tr th:each="l:${loans}"><td th:text="${l.student.name}"></td><td th:text="${l.book.title}"></td><td th:text="${l.issueDate}"></td><td th:text="${l.dueDate}"></td><td th:text="${l.returnDate==null?'Not returned':l.returnDate}"></td><td><span th:if="${l.overdue}" class="badge bg-danger">Overdue</span><span th:if="${l.returnDate==null and !l.overdue}" class="badge bg-warning text-dark">Issued</span><span th:if="${l.returnDate!=null}" class="badge bg-success">Returned</span><form th:if="${l.returnDate==null}" th:action="@{'/return/'+${l.id}}" method="post"><button class="btn btn-sm btn-outline-primary mt-1">Return</button></form></td></tr></tbody></table></div></div>
<div class="card p-3 mt-3"><h5>Student history</h5><a th:each="s:${students}" class="btn btn-sm btn-outline-secondary me-2 mb-2" th:href="@{'/history/'+${s.id}}" th:text="${s.name}"></a></div></main></body></html>
